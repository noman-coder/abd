name: Khanewal Connect Production Host & 5-Hour Cloudflare Tunnel with Encrypted Drive Backup

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      duration_hours:
        description: 'Duration to keep app live (1 to 5 hours)'
        required: true
        default: '5'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
      force_fresh_database:
        description: 'ONLY if every Drive backup is corrupt: allow a fresh empty database'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: mysql-cloudflare-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  host-live-app-with-tunnel:
    name: Live Host on Custom Domain & Encrypted Drive MySQL Backup
    runs-on: ubuntu-latest
    timeout-minutes: 350

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password_123
          MYSQL_DATABASE: omniserve_db
          MYSQL_USER: omniserve
          MYSQL_PASSWORD: omniserve_secure_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot_password_123"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Detect MySQL Mode (hosted MySQL vs runner-local MySQL)
        id: dbmode
        env:
          EXT_HOST: ${{ secrets.MYSQL_HOST }}
        run: |
          if [ -n "$EXT_HOST" ]; then
            echo "external=true" >> "$GITHUB_OUTPUT"
            echo "Using EXTERNAL hosted MySQL (no Drive backup needed)."
          else
            echo "external=false" >> "$GITHUB_OUTPUT"
            echo "Using runner-local MySQL with encrypted rclone Drive backup."
          fi

      # ---------------------------------------------------------------
      # rclone + encrypted remote (kwlcrypt -> gdrive:kwlconnectservice)
      # Secrets needed:
      #   RCLONE_CONF      = full text of rclone.conf that has a [gdrive] drive remote
      #   RCLONE_CRYPT_PASS    = encryption password (any strong string)
      #   RCLONE_CRYPT_SALT    = second password / salt (different strong string)
      # ---------------------------------------------------------------
      - name: Install rclone & Configure Encrypted Drive Remote
        if: steps.dbmode.outputs.external != 'true'
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          CRYPT_PASS: ${{ secrets.RCLONE_CRYPT_PASS }}
          CRYPT_SALT: ${{ secrets.RCLONE_CRYPT_SALT }}
        run: |
          if [ -z "$RCLONE_CONF" ] || [ -z "$CRYPT_PASS" ] || [ -z "$CRYPT_SALT" ]; then
            echo "ERROR: secrets RCLONE_CONF, RCLONE_CRYPT_PASS and RCLONE_CRYPT_SALT are required."
            exit 1
          fi

          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version | head -n 1

          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf

          cat >> ~/.config/rclone/rclone.conf <<EOF

          [kwlcrypt]
          type = crypt
          remote = gdrive:kwlconnectservice
          filename_encryption = standard
          directory_name_encryption = true
          password = $(rclone obscure "$CRYPT_PASS")
          password2 = $(rclone obscure "$CRYPT_SALT")
          EOF

          # Make sure the Drive folder exists (creates it if missing). Fails if Drive/auth is broken.
          rclone mkdir gdrive:kwlconnectservice
          rclone mkdir kwlcrypt:history
          echo "Drive folder 'kwlconnectservice' is ready. Backups inside are encrypted (names + content)."

          # Reusable backup script (used by the periodic loop and the final step)
          cat > "$RUNNER_TEMP/kwl_backup.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -o pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p mysql-backup
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          TMP=mysql-backup/snapshot.tmp.gz
          KEEP=${KEEP_SNAPSHOTS:-48}

          if mysqldump -h 127.0.0.1 -u root --databases omniserve_db \
               --single-transaction --routines --triggers --events \
               --add-drop-table --complete-insert 2>/dev/null | gzip -9 > "$TMP" \
             && gzip -t "$TMP" && [ "$(stat -c%s "$TMP")" -gt 1000 ]; then
            mv "$TMP" mysql-backup/snapshot.sql.gz
            OK=0
            for i in 1 2 3; do
              if rclone copyto mysql-backup/snapshot.sql.gz "kwlcrypt:history/snapshot-$TS.sql.gz" --retries 3; then
                OK=1; break
              fi
              sleep 5
            done
            if [ $OK -eq 1 ]; then
              echo "[$(date -u +%H:%M:%SZ)] Encrypted snapshot uploaded: snapshot-$TS.sql.gz"
              # Prune: keep only the newest $KEEP snapshots
              rclone lsf kwlcrypt:history --files-only | sort | head -n -"$KEEP" | while read -r f; do
                [ -n "$f" ] && rclone deletefile "kwlcrypt:history/$f"
              done
            else
              echo "[$(date -u +%H:%M:%SZ)] WARNING: Drive upload failed; older Drive snapshots are untouched."
            fi
          else
            rm -f "$TMP"
            echo "[$(date -u +%H:%M:%SZ)] WARNING: dump failed validation; nothing uploaded, older snapshots kept."
          fi
          SCRIPT
          chmod +x "$RUNNER_TEMP/kwl_backup.sh"

      - name: Initialize or Restore MySQL Database (from encrypted Drive backup)
        if: steps.dbmode.outputs.external != 'true'
        env:
          MYSQL_PWD: root_password_123
          FORCE_FRESH: ${{ github.event.inputs.force_fresh_database || 'false' }}
        run: |
          echo "Waiting for MySQL container readiness..."
          until mysqladmin ping -h 127.0.0.1 -u root --silent; do sleep 1; done
          echo "MySQL service is healthy."

          mkdir -p mysql-backup
          mysql -h 127.0.0.1 -u root -e "CREATE DATABASE IF NOT EXISTS omniserve_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

          # List snapshots from Drive (newest first). If this fails we stop: never start empty by mistake.
          CANDIDATES=$(rclone lsf kwlcrypt:history --files-only | sort -r | head -n 5) || {
            echo "ERROR: cannot read Drive backups. Refusing to start with an empty database."
            exit 1
          }

          RESTORE_DONE=0
          if [ -n "$CANDIDATES" ]; then
            for f in $CANDIDATES; do
              echo "=========================================================="
              echo "Trying encrypted backup: $f"
              echo "=========================================================="
              rm -f mysql-backup/restore.sql.gz
              if ! rclone copyto "kwlcrypt:history/$f" mysql-backup/restore.sql.gz --retries 3; then
                echo "Download/decrypt failed for $f, trying older one..."
                continue
              fi
              if ! gzip -t mysql-backup/restore.sql.gz; then
                echo "$f is corrupt (gzip test failed), trying older one..."
                continue
              fi

              mysql -h 127.0.0.1 -u root -e "DROP DATABASE IF EXISTS omniserve_db; CREATE DATABASE omniserve_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
              set +e
              zcat mysql-backup/restore.sql.gz \
                | sed -E '/(CREATE DATABASE|USE)[[:space:]]+`?(mysql|sys|performance_schema|information_schema)`?/Id' \
                | sed -E 's/DEFINER=`[^`]+`@`[^`]+`//g' \
                | mysql -h 127.0.0.1 -u root --force omniserve_db 2> restore_log.txt
              set -e

              TABLE_COUNT=$(mysql -h 127.0.0.1 -u root omniserve_db -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'omniserve_db';" 2>/dev/null || echo 0)
              echo "Tables found after restore: $TABLE_COUNT"
              if [ "$TABLE_COUNT" -gt 0 ]; then
                echo "Restored successfully from $f"
                RESTORE_DONE=1
                break
              fi
              echo "Restore from $f produced no tables. Log:"; cat restore_log.txt || true
            done

            if [ $RESTORE_DONE -eq 0 ]; then
              if [ "$FORCE_FRESH" = "true" ]; then
                echo "force_fresh_database=true: starting with a fresh schema."
                mysql -h 127.0.0.1 -u root -e "DROP DATABASE IF EXISTS omniserve_db; CREATE DATABASE omniserve_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
              else
                echo "ERROR: Drive backups exist but none could be restored (wrong crypt keys?)."
                echo "Refusing to start with an empty DB. Drive backups are untouched."
                echo "Re-run with force_fresh_database=true only if you really want a new DB."
                exit 1
              fi
            fi
          else
            echo "No backups in Drive yet (first run). Starting fresh."
          fi

          if [ $RESTORE_DONE -eq 0 ]; then
            echo "Initializing fresh production schema from db/schema.sql..."
            mysql -h 127.0.0.1 -u root omniserve_db < db/schema.sql
          fi

          ADMIN_USER_SECRET="${{ secrets.ADMIN_USERNAME }}"
          ADMIN_PASS_SECRET="${{ secrets.ADMIN_PASSWORD }}"
          if [ -n "$ADMIN_USER_SECRET" ]; then
            mysql -h 127.0.0.1 -u root omniserve_db -e "UPDATE users SET email = '$ADMIN_USER_SECRET' WHERE id = 'usr-admin-1';" || true
          fi
          if [ -n "$ADMIN_PASS_SECRET" ]; then
            mysql -h 127.0.0.1 -u root omniserve_db -e "UPDATE users SET password = '$ADMIN_PASS_SECRET' WHERE id = 'usr-admin-1';" || true
          fi

          echo "Database verification summary:"
          mysql -h 127.0.0.1 -u omniserve -pomniserve_secure_password omniserve_db -e "
            SELECT 'users' AS table_name, COUNT(*) AS total_rows FROM users
            UNION ALL SELECT 'services', COUNT(*) FROM services
            UNION ALL SELECT 'vehicles', COUNT(*) FROM vehicles
            UNION ALL SELECT 'orders', COUNT(*) FROM orders;
          "

          # Plain restore file must not linger on the runner
          rm -f mysql-backup/restore.sql.gz

      - name: Install Application Dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Configure Firebase from GitHub Secrets
        env:
          SEC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          SEC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          SEC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          SEC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          SEC_FIREBASE_FIRESTORE_DATABASE_ID: ${{ secrets.FIREBASE_FIRESTORE_DATABASE_ID || secrets.FIREBASE_DATABASE_ID }}
          SEC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          SEC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          SEC_FIREBASE_OAUTH_CLIENT_ID: ${{ secrets.FIREBASE_OAUTH_CLIENT_ID }}
        run: |
          if [ -n "$SEC_FIREBASE_PROJECT_ID" ]; then
            node -e '
              const fs = require("fs");
              const pId = process.env.SEC_FIREBASE_PROJECT_ID || "";
              const config = {
                projectId: pId,
                appId: process.env.SEC_FIREBASE_APP_ID || "",
                apiKey: process.env.SEC_FIREBASE_API_KEY || "",
                authDomain: process.env.SEC_FIREBASE_AUTH_DOMAIN || (pId ? `${pId}.firebaseapp.com` : ""),
                firestoreDatabaseId: process.env.SEC_FIREBASE_FIRESTORE_DATABASE_ID || "(default)",
                storageBucket: process.env.SEC_FIREBASE_STORAGE_BUCKET || (pId ? `${pId}.firebasestorage.app` : ""),
                messagingSenderId: process.env.SEC_FIREBASE_MESSAGING_SENDER_ID || "",
                measurementId: "",
                oAuthClientId: process.env.SEC_FIREBASE_OAUTH_CLIENT_ID || "",
                recaptchaSiteKey: ""
              };
              fs.writeFileSync("firebase-applet-config.json", JSON.stringify(config, null, 2));
            '
            echo "firebase-applet-config.json configured from GitHub Secrets."
          else
            echo "Notice: FIREBASE_PROJECT_ID secret not provided. Using existing configuration."
          fi

      - name: Build Production Frontend Assets
        env:
          VITE_ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME || 'admin@omniserve.com' }}
          VITE_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'Admin@12345' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_FIRESTORE_DATABASE_ID: ${{ secrets.FIREBASE_FIRESTORE_DATABASE_ID || secrets.FIREBASE_DATABASE_ID || '(default)' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_OAUTH_CLIENT_ID: ${{ secrets.FIREBASE_OAUTH_CLIENT_ID }}
        run: npm run build

      - name: Install Cloudflare Tunnel (cloudflared)
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          cloudflared --version

      - name: Start Server, Connect Cloudflare Tunnel & Host Live
        env:
          NODE_ENV: production
          PORT: 3000
          MYSQL_HOST: ${{ secrets.MYSQL_HOST || '127.0.0.1' }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT || '3306' }}
          MYSQL_USER: ${{ secrets.MYSQL_USER || 'omniserve' }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD || 'omniserve_secure_password' }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE || 'omniserve_db' }}
          MYSQL_SSL: ${{ secrets.MYSQL_SSL }}
          EXTERNAL_DB: ${{ steps.dbmode.outputs.external }}
          MYSQL_PWD: root_password_123
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME || 'admin@omniserve.com' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'Admin@12345' }}
          VITE_ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME || 'admin@omniserve.com' }}
          RESET_KEY: ${{ secrets.RESET_KEY }}
          RESET_PASS: ${{ secrets.RESET_PASS }}
          VITE_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'Admin@12345' }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_FIRESTORE_DATABASE_ID: ${{ secrets.FIREBASE_FIRESTORE_DATABASE_ID || secrets.FIREBASE_DATABASE_ID || '(default)' }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_FIRESTORE_DATABASE_ID: ${{ secrets.FIREBASE_FIRESTORE_DATABASE_ID || secrets.FIREBASE_DATABASE_ID || '(default)' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_OAUTH_CLIENT_ID: ${{ secrets.FIREBASE_OAUTH_CLIENT_ID }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SENDER_NAME: ${{ secrets.SENDER_NAME || 'Khanewal Connect' }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        run: |
          echo "Launching Khanewal Connect Express Application..."
          nohup npx tsx server.ts > app.log 2>&1 &
          APP_PID=$!
          echo "Express server process initiated (PID: $APP_PID)"

          APP_READY=0
          for i in {1..35}; do
            if curl -s http://127.0.0.1:3000/api/health | grep -q "healthy"; then
              echo "App server is HEALTHY on http://127.0.0.1:3000"
              APP_READY=1
              break
            fi
            sleep 1
          done

          if [ $APP_READY -eq 0 ]; then
            echo "ERROR: App server failed to respond within 35 seconds. Diagnostic log:"
            cat app.log
            exit 1
          fi

          if [ -n "$CLOUDFLARE_TUNNEL_TOKEN" ]; then
            nohup cloudflared tunnel --no-autoupdate run --token "$CLOUDFLARE_TUNNEL_TOKEN" > cloudflared.log 2>&1 &
            echo "Cloudflare Tunnel active."
          else
            echo "WARNING: CLOUDFLARE_TUNNEL_TOKEN not set. Running fallback quick tunnel..."
            nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:3000 > cloudflared.log 2>&1 &
          fi

          sleep 5
          head -n 25 cloudflared.log || true

          DURATION_HOURS=${{ github.event.inputs.duration_hours || '5' }}
          TOTAL_SECONDS=$((DURATION_HOURS * 3600))
          INTERVAL=120

          echo "=========================================================================="
          echo " Khanewal Connect is LIVE: https://84wala.uqn88.store"
          echo " Duration: $DURATION_HOURS hours. Cancel anytime; final backup still runs."
          echo "=========================================================================="

          # Take one backup right after start so Drive always has a snapshot of the restored state
          if [ "$EXTERNAL_DB" != "true" ]; then
            "$RUNNER_TEMP/kwl_backup.sh" || true
          fi

          ELAPSED=0
          while [ $ELAPSED -lt $TOTAL_SECONDS ]; do
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
            MINUTES_RUN=$((ELAPSED / 60))
            MINUTES_REMAINING=$(((TOTAL_SECONDS - ELAPSED) / 60))

            HEALTH_STATUS=$(curl -s http://127.0.0.1:3000/api/health || echo '{"status":"unreachable"}')
            echo "[$(date -u +"%H:%M:%SZ")] ${MINUTES_RUN}m elapsed | ${MINUTES_REMAINING}m remaining | Health: $HEALTH_STATUS"

            # Encrypted backup to Drive every 10 minutes
            if [ "$EXTERNAL_DB" != "true" ] && [ $((ELAPSED % 600)) -eq 0 ]; then
              "$RUNNER_TEMP/kwl_backup.sh" || true
            fi

            if ! curl -s http://127.0.0.1:3000/api/health | grep -q "healthy"; then
              echo "WARNING: App health probe failed! Restarting server..."
              tail -n 30 app.log || true
              nohup npx tsx server.ts > app.log 2>&1 &
              sleep 5
            fi

            if ! pgrep -f cloudflared > /dev/null; then
              echo "WARNING: Cloudflare Tunnel terminated! Restarting..."
              if [ -n "$CLOUDFLARE_TUNNEL_TOKEN" ]; then
                nohup cloudflared tunnel --no-autoupdate run --token "$CLOUDFLARE_TUNNEL_TOKEN" > cloudflared.log 2>&1 &
              fi
            fi
          done

          echo "Live session completed successfully."

      # Final encrypted backup: runs on success, failure, cancel and timeout
      - name: Final Encrypted Snapshot to Google Drive
        if: always() && steps.dbmode.outputs.external != 'true'
        env:
          MYSQL_PWD: root_password_123
        run: |
          if mysqladmin ping -h 127.0.0.1 -u root --silent; then
            "$RUNNER_TEMP/kwl_backup.sh"
            rclone lsf kwlcrypt:history --files-only | sort | tail -n 3
          else
            echo "Notice: MySQL unreachable. Existing Drive backups retained."
          fi
